<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шёпот</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .hub-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 18px 30px;
            z-index: 1;
            width: 100%;
            min-height: 100%;
        }

        .hub-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 340px;
            margin-bottom: 24px;
        }

        .hub-greeting {
            font-family: var(--font-heading);
            font-size: 24px;
            color: var(--text-primary);
            text-align: left;
            line-height: 1.2;
        }

        .hub-greeting span { color: var(--gold); }

        .hub-mayak {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(201, 169, 110, 0.08);
            border: 1px solid rgba(201, 169, 110, 0.2);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s;
            font-size: 20px; flex-shrink: 0; position: relative;
        }

        .hub-mayak:hover {
            background: rgba(201, 169, 110, 0.15);
            box-shadow: 0 0 20px rgba(201, 169, 110, 0.25);
        }

        .hub-mayak:active { transform: scale(0.9); }

        .hub-mayak.received {
            background: rgba(255, 152, 0, 0.2);
            border-color: #FF9800;
            animation: mayakPulse 1.5s ease-in-out infinite;
        }

        @keyframes mayakPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 152, 0, 0.3); }
            50% { box-shadow: 0 0 25px rgba(255, 152, 0, 0.6); }
        }

        .mayak-tooltip {
            display: none;
            position: absolute; top: -40px; right: -20px;
            background: rgba(20, 16, 18, 0.95);
            border: 1px solid var(--gold); border-radius: 12px;
            padding: 8px 14px; font-size: 11px; color: var(--text-primary);
            white-space: nowrap; z-index: 10;
            animation: fadeIn 0.3s ease;
        }

        .hub-mayak.received .mayak-tooltip { display: block; }

        .hub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }

        .hub-card {
            background: rgba(20, 16, 18, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(201, 169, 110, 0.08);
            border-radius: 20px; padding: 18px 14px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; text-decoration: none;
            position: relative; overflow: hidden;
        }

        .hub-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(201, 169, 110, 0.04), transparent 60%);
            opacity: 0; transition: opacity 0.35s;
        }

        .hub-card:hover {
            border-color: rgba(201, 169, 110, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .hub-card:hover::before { opacity: 1; }
        .hub-card:active { transform: scale(0.96); }

        .hub-icon { font-size: 30px; position: relative; z-index: 1; }

        .hub-card-title {
            font-family: var(--font-heading); font-size: 13px;
            color: var(--text-primary); position: relative; z-index: 1;
        }

        .hub-card-sub {
            font-size: 10px; color: var(--text-secondary);
            line-height: 1.3; position: relative; z-index: 1;
        }

        .hub-card-badge {
            position: absolute; top: 8px; right: 8px;
            font-size: 8px; letter-spacing: 1px; text-transform: uppercase;
            background: rgba(201, 169, 110, 0.12); color: var(--gold);
            padding: 3px 8px; border-radius: 10px; z-index: 2;
        }

        .hub-card-lock {
            position: absolute; top: 8px; right: 8px;
            font-size: 10px; z-index: 2; opacity: 0.5;
        }

        .notification-dot {
            position: absolute; top: 8px; right: 8px;
            width: 18px; height: 18px;
            background: var(--rose); border-radius: 50%;
            font-size: 10px; color: white;
            display: flex; align-items: center; justify-content: center;
            z-index: 3; animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .hub-card-wide {
            grid-column: 1 / -1;
            flex-direction: row; justify-content: space-between;
            align-items: center; padding: 16px 18px;
        }

        .hub-card-wide .hub-card-left {
            display: flex; align-items: center; gap: 12px; text-align: left;
        }

        .hub-card-wide .hub-card-info {
            display: flex; flex-direction: column; gap: 2px;
        }

        .hub-card-arrow { font-size: 14px; color: var(--gold); opacity: 0.4; }

        .hub-card-counter {
            font-family: 'Inter', monospace; font-size: 11px;
            color: var(--gold); opacity: 0.7; text-align: right;
        }

        /* ===== Кнопка "Посоветовать другу" (скромная) ===== */
        .hub-share-wrapper {
            width: 100%;
            max-width: 340px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .hub-share-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 110, 0.12), transparent);
            margin-bottom: 2px;
        }

        .btn-share-app {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(201, 169, 110, 0.1);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-body);
            font-weight: 400;
            width: auto;
            letter-spacing: 0.3px;
            opacity: 0.6;
        }

        .btn-share-app:hover {
            border-color: rgba(201, 169, 110, 0.25);
            background: rgba(201, 169, 110, 0.05);
            color: var(--gold);
            opacity: 1;
            transform: translateY(-1px);
        }

        .btn-share-app:active {
            transform: scale(0.97);
        }

        .btn-share-app .share-icon {
            font-size: 14px;
        }

        .btn-share-app .share-text {
            font-size: 11px;
        }

        /* Адаптация под маленькие экраны */
        @media (max-width: 380px) {
            .btn-share-app {
                padding: 6px 14px;
                font-size: 11px;
            }
            .btn-share-app .share-icon {
                font-size: 12px;
            }
            .btn-share-app .share-text {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="sparkles">
            <div class="sparkle" style="top: 6%; left: 12%;"></div>
            <div class="sparkle" style="top: 18%; right: 18%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="bottom: 22%; left: 22%; animation-delay: 1s;"></div>
            <div class="sparkle" style="bottom: 14%; right: 16%; animation-delay: 1.5s;"></div>
            <div class="sparkle" style="top: 38%; left: 6%; animation-delay: 0.7s;"></div>
            <div class="sparkle" style="top: 34%; right: 6%; animation-delay: 1.2s;"></div>
        </div>

        <div class="hub-screen">
            <div class="hub-header">
                <div class="hub-greeting">
                    Привет,<br><span id="hubName">Я</span>
                </div>
                <div class="hub-mayak" id="mayakBtn" onclick="sendMayak()" title="Я думаю о тебе">
                    💡
                    <span class="mayak-tooltip" id="mayakTooltip">Партнёр думает о тебе ❤️</span>
                </div>
            </div>

            <div class="hub-grid">
                <div class="hub-card hub-card-wide" onclick="navigate('today')">
                    <div class="hub-card-left">
                        <div class="hub-icon">🏠</div>
                        <div class="hub-card-info">
                            <div class="hub-card-title">Сегодня</div>
                            <div class="hub-card-sub">Задание, настроение</div>
                        </div>
                    </div>
                    <div class="hub-card-counter" id="hubCounter">...</div>
                    <div class="hub-card-arrow">→</div>
                </div>

                <div class="hub-card" onclick="navigate('questions')" id="cardQuestions">
                    <div class="hub-icon">💬</div>
                    <div class="hub-card-title">Вопросы</div>
                    <div class="hub-card-sub">Узнайте друг друга</div>
                </div>

                <div class="hub-card" onclick="navigate('games')" id="cardGames">
                    <div class="hub-icon">🎲</div>
                    <div class="hub-card-title">Игры</div>
                    <div class="hub-card-sub">Миссии, свидания</div>
                </div>

                <div class="hub-card" onclick="navigate('beyond')" id="cardBeyond">
                    <div class="hub-card-lock">🔞</div>
                    <div class="hub-icon">🔥</div>
                    <div class="hub-card-title">За гранью</div>
                    <div class="hub-card-sub">Только для взрослых</div>
                </div>

                <div class="hub-card" onclick="navigate('moments')">
                    <div class="hub-icon">📸</div>
                    <div class="hub-card-title">Моменты</div>
                    <div class="hub-card-sub">Фото, календарь</div>
                </div>

                <div class="hub-card" onclick="navigate('we')" id="cardWe">
                    <div class="hub-icon">💌</div>
                    <div class="hub-card-title">Мы</div>
                    <div class="hub-card-sub">Чат, достижения</div>
                </div>

                <div class="hub-card" onclick="navigate('profile')">
                    <div class="hub-icon">⚙️</div>
                    <div class="hub-card-title">Профиль</div>
                    <div class="hub-card-sub">Настройки</div>
                </div>
            </div>

            <!-- ===== КНОПКА "ПОСОВЕТОВАТЬ ДРУГУ" (СКРОМНАЯ) ===== -->
            <div class="hub-share-wrapper">
                <div class="hub-share-divider"></div>
                <button class="btn-share-app" onclick="shareApp()">
                    <span class="share-icon">📤</span>
                    <span class="share-text">Посоветовать другу</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const myName = localStorage.getItem('shepot_my_name') || 'Я';
        document.getElementById('hubName').textContent = myName;

        function updateCounter() {
            const startDate = localStorage.getItem('shepot_start_date');
            if (startDate) {
                const start = new Date(startDate);
                const now = new Date();
                const days = Math.floor((now - start) / (1000 * 60 * 60 * 24));
                document.getElementById('hubCounter').textContent = days + ' дн.';
            } else {
                document.getElementById('hubCounter').textContent = '';
            }
        }
        updateCounter();

        function checkMayak() {
            const mayakData = JSON.parse(localStorage.getItem('shepot_mayak_sent') || 'null');
            const mayakBtn = document.getElementById('mayakBtn');
            
            if (mayakData && mayakData.from === 'partner') {
                const sentTime = new Date(mayakData.time);
                const now = new Date();
                const hoursSince = (now - sentTime) / (1000 * 60 * 60);
                
                if (hoursSince < 1) {
                    mayakBtn.classList.add('received');
                    mayakBtn.querySelector('.mayak-tooltip').style.display = 'block';
                } else {
                    localStorage.removeItem('shepot_mayak_sent');
                }
            }
        }

        function sendMayak() {
            const mayakBtn = document.getElementById('mayakBtn');
            
            localStorage.setItem('shepot_mayak_sent', JSON.stringify({
                from: 'me',
                time: new Date().toISOString()
            }));
            
            mayakBtn.textContent = '✨';
            mayakBtn.style.background = 'rgba(201, 169, 110, 0.2)';
            mayakBtn.style.boxShadow = '0 0 25px rgba(201, 169, 110, 0.4)';
            
            showToast('💡 Маячок отправлен!');
            
            setTimeout(() => {
                mayakBtn.textContent = '💡';
                mayakBtn.style.background = 'rgba(201, 169, 110, 0.08)';
                mayakBtn.style.boxShadow = 'none';
            }, 1500);
        }

        document.getElementById('mayakBtn').addEventListener('click', function() {
            const mayakData = JSON.parse(localStorage.getItem('shepot_mayak_sent') || 'null');
            if (mayakData && mayakData.from === 'partner') {
                localStorage.removeItem('shepot_mayak_sent');
                this.classList.remove('received');
                this.querySelector('.mayak-tooltip').style.display = 'none';
                showToast('❤️ Вы знаете, что партнёр думает о вас');
            }
        });

        function checkNotifications() {
            const newMessages = JSON.parse(localStorage.getItem('shepot_new_messages') || '0');
            if (newMessages > 0) addNotificationDot('cardWe', newMessages);
            
            const newMatches = JSON.parse(localStorage.getItem('shepot_new_matches') || '0');
            if (newMatches > 0) addNotificationDot('cardQuestions', newMatches);
            
            const newFantasies = JSON.parse(localStorage.getItem('shepot_new_fantasies') || '0');
            if (newFantasies > 0) addNotificationDot('cardBeyond', newFantasies);
            
            const newWishes = JSON.parse(localStorage.getItem('shepot_new_wishes') || '0');
            if (newWishes > 0) addNotificationDot('cardGames', newWishes);
        }

        function addNotificationDot(cardId, count) {
            const card = document.getElementById(cardId);
            if (!card) return;
            
            const oldDot = card.querySelector('.notification-dot');
            if (oldDot) oldDot.remove();
            
            const dot = document.createElement('div');
            dot.className = 'notification-dot';
            dot.textContent = count > 9 ? '9+' : count;
            card.appendChild(dot);
        }

        function navigate(page) {
            const pages = {
                'today': 'today.html', 'questions': 'questions.html', 'games': 'games.html',
                'beyond': 'beyond.html', 'moments': 'moments.html', 'we': 'we.html', 'profile': 'profile.html'
            };
            if (pages[page]) window.location.href = pages[page];
        }

        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== ФУНКЦИЯ "ПОСОВЕТОВАТЬ ДРУГУ" =====
        function shareApp() {
            const appName = 'Шёпот';
            const appUrl = 'https://shepot.app'; // Замени на реальный URL, когда появится
            
            const message = `🔥 Нашли с партнёром крутое приложение для пар!\n\n💬 Отвечаем на вопросы, играем и становимся ближе.\n🎲 Попробуй и ты!\n\n👉 ${appUrl}`;

            if (navigator.share) {
                navigator.share({
                    title: appName,
                    text: message,
                    url: appUrl
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(message).then(() => {
                    showToast('🔗 Ссылка скопирована! Поделись с друзьями.');
                }).catch(() => {
                    fallbackCopy(message);
                });
            } else {
                fallbackCopy(message);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('🔗 Ссылка скопирована! Поделись с друзьями.');
            } catch (e) {
                showToast('📋 Скопируй ссылку: ' + text);
            }
            document.body.removeChild(textarea);
        }

        checkMayak();
        checkNotifications();
    </script>
    <!-- ===== PWA ИНИЦИАЛИЗАЦИЯ ===== -->
    <script src="../js/pwa-init.js"></script>
</body>
</html>
