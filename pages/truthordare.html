<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шёпот — Правда или действие</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .page-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 18px 120px;
            z-index: 1;
            width: 100%;
            min-height: 100%;
        }

        .page-title {
            font-family: var(--font-heading);
            font-size: 22px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .page-sub {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .score-board { display: flex; gap: 20px; margin-bottom: 16px; }

        .score-item {
            text-align: center;
            background: rgba(20, 16, 18, 0.5);
            border: 1px solid rgba(201, 169, 110, 0.1);
            border-radius: 16px;
            padding: 12px 18px;
            min-width: 80px;
        }

        .score-item.active {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(201, 169, 110, 0.3);
        }

        .score-name { font-size: 10px; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 4px; }
        .score-num { font-size: 28px; font-weight: 600; color: var(--gold); font-family: var(--font-heading); }

        .choice-buttons { display: flex; gap: 16px; margin-bottom: 20px; }

        .btn-choice {
            width: 120px; height: 120px;
            border-radius: 24px;
            border: 2px solid rgba(201, 169, 110, 0.3);
            background: rgba(20, 16, 18, 0.5);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 8px;
        }

        .btn-choice:hover {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(201, 169, 110, 0.2);
            transform: translateY(-3px);
        }

        .btn-choice-icon { font-size: 36px; }
        .btn-choice-text { font-family: var(--font-heading); font-size: 16px; color: var(--text-primary); }
        .btn-choice-sub { font-size: 10px; color: var(--text-secondary); }

        .result-card {
            background: rgba(20, 16, 18, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(201, 169, 110, 0.2);
            border-radius: 20px;
            padding: 28px 20px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .result-card.show { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-type {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 3px; color: var(--gold); margin-bottom: 10px;
        }

        .result-text {
            font-family: var(--font-heading); font-size: 18px;
            color: var(--text-primary); line-height: 1.5; margin-bottom: 20px;
        }

        .result-buttons { display: flex; gap: 10px; justify-content: center; }

        .btn-done {
            padding: 10px 20px; border-radius: 30px; border: none;
            background: var(--gold); color: #0D1117;
            font-size: 13px; cursor: pointer; font-weight: 600;
        }

        .btn-fail {
            padding: 10px 20px; border-radius: 30px;
            border: 1px solid rgba(201, 169, 110, 0.3);
            background: transparent; color: var(--text-secondary);
            font-size: 13px; cursor: pointer;
        }

        .btn-fail:hover { border-color: var(--rose); color: var(--rose); }

        .end-screen { display: none; flex-direction: column; align-items: center; gap: 12px; }
        .end-screen.show { display: flex; }

        .end-title { font-family: var(--font-heading); font-size: 24px; color: var(--gold); }
        .end-winner { font-size: 16px; color: var(--text-primary); }

        .btn-restart {
            padding: 14px 36px; border-radius: 50px; border: none;
            background: var(--gold); color: #0D1117;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }

        .settings-block { width: 100%; max-width: 300px; text-align: left; margin-top: 16px; }
        .settings-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary); margin-bottom: 8px; text-align: center; }

        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: 1px solid rgba(201, 169, 110, 0.08);
        }

        .toggle-label { font-size: 11px; color: var(--text-primary); }

        .toggle-switch {
            width: 36px; height: 20px;
            background: rgba(201, 169, 110, 0.2);
            border-radius: 10px;
            cursor: pointer; position: relative;
            transition: all 0.3s;
        }

        .toggle-switch.active { background: var(--gold); }

        .toggle-switch::after {
            content: '';
            position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px;
            border-radius: 50%; background: white;
            transition: all 0.3s;
        }

        .toggle-switch.active::after { left: 18px; }
    </style>
</head>
<body>

    <div class="phone">
        <div class="sparkles">
            <div class="sparkle" style="top: 8%; left: 14%;"></div>
            <div class="sparkle" style="top: 20%; right: 20%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="bottom: 24%; left: 24%; animation-delay: 1s;"></div>
            <div class="sparkle" style="bottom: 16%; right: 18%; animation-delay: 1.5s;"></div>
            <div class="sparkle" style="top: 42%; left: 6%; animation-delay: 0.7s;"></div>
            <div class="sparkle" style="top: 38%; right: 6%; animation-delay: 1.2s;"></div>
        </div>

        <div class="page-screen" id="gameScreen">
            <div class="page-title">Правда или действие</div>
            <div class="page-sub" id="turnLabel">Ходит: ...</div>

            <div class="score-board">
                <div class="score-item active" id="score1">
                    <div class="score-name" id="name1">Я</div>
                    <div class="score-num" id="num1">0</div>
                </div>
                <div class="score-item" id="score2">
                    <div class="score-name" id="name2">Партнёр</div>
                    <div class="score-num" id="num2">0</div>
                </div>
            </div>

            <div class="choice-buttons" id="choiceButtons">
                <div class="btn-choice" onclick="pickCard('truth')">
                    <div class="btn-choice-icon">💬</div>
                    <div class="btn-choice-text">Правда</div>
                    <div class="btn-choice-sub">отвечайте честно</div>
                </div>
                <div class="btn-choice" onclick="pickCard('dare')">
                    <div class="btn-choice-icon">🔥</div>
                    <div class="btn-choice-text">Действие</div>
                    <div class="btn-choice-sub">выполняйте</div>
                </div>
            </div>

            <div class="result-card" id="resultCard">
                <div class="result-type" id="resultType"></div>
                <div class="result-text" id="resultText"></div>
                <div class="result-buttons">
                    <button class="btn-done" onclick="markDone()">✓ Выполнил</button>
                    <button class="btn-fail" onclick="markFail()">✗ Не выполнил</button>
                </div>
            </div>

            <div class="end-screen" id="endScreen">
                <div class="end-title">Игра окончена!</div>
                <div class="end-winner" id="endWinner"></div>
                <button class="btn-restart" onclick="restartGame()">Играть заново</button>
            </div>

            <div class="settings-block">
                <div class="settings-title">Уровень</div>
                <div class="toggle-row">
                    <span class="toggle-label">Лёгкий</span>
                    <div class="toggle-switch active" id="toggleEasy" onclick="toggleSetting('easy')"></div>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">Средний</span>
                    <div class="toggle-switch active" id="toggleMedium" onclick="toggleSetting('medium')"></div>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">Хардкор</span>
                    <div class="toggle-switch" id="toggleHard" onclick="toggleSetting('hard')"></div>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">Раундов: <span id="roundCount">10</span></span>
                    <button class="btn-fail" style="padding:4px 12px;font-size:11px;" onclick="changeRounds()">Изменить</button>
                </div>
            </div>

            <button class="btn-back" onclick="window.location.href='beyond.html'">← В За гранью</button>
        </div>

        <div class="tab-bar">
            <div class="tab" onclick="navigate('today')"><span class="tab-icon">🏠</span> Сегодня</div>
            <div class="tab" onclick="navigate('questions')"><span class="tab-icon">💬</span> Вопросы</div>
            <div class="tab" onclick="navigate('games')"><span class="tab-icon">🎲</span> Игры</div>
            <div class="tab" onclick="navigate('beyond')"><span class="tab-icon">🔥</span> За гранью</div>
            <div class="tab" onclick="navigate('moments')"><span class="tab-icon">📸</span> Моменты</div>
            <div class="tab" onclick="navigate('we')"><span class="tab-icon">💌</span> Мы</div>
        </div>
    </div>

    <script>
        const myName = localStorage.getItem('shepot_my_name') || 'Я';
        const partnerName = localStorage.getItem('shepot_partner_name') || 'Партнёр';
        const playerNames = [myName, partnerName];

        const turnLabel = document.getElementById('turnLabel');
        const name1El = document.getElementById('name1');
        const name2El = document.getElementById('name2');
        const num1El = document.getElementById('num1');
        const num2El = document.getElementById('num2');
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');
        const choiceButtons = document.getElementById('choiceButtons');
        const resultCard = document.getElementById('resultCard');
        const resultType = document.getElementById('resultType');
        const resultText = document.getElementById('resultText');
        const endScreen = document.getElementById('endScreen');
        const endWinner = document.getElementById('endWinner');
        const roundCountEl = document.getElementById('roundCount');

        let gameData = null;
        let activeSettings = { easy: true, medium: true, hard: false };
        let maxRounds = 10;
        let currentPlayer = 1;
        let scores = [0, 0];
        let lastCard = null;

        name1El.textContent = playerNames[0];
        name2El.textContent = playerNames[1];
        turnLabel.textContent = 'Ходит: ' + playerNames[0];

        fetch('../data/truthordare.json')
            .then(res => res.json())
            .then(data => { gameData = data.truthordare; });

        function toggleSetting(cat) {
            activeSettings[cat] = !activeSettings[cat];
            document.getElementById('toggle' + cat.charAt(0).toUpperCase() + cat.slice(1)).classList.toggle('active', activeSettings[cat]);
        }

        function changeRounds() {
            const input = prompt('Сколько раундов? (от 3 до 30)', maxRounds);
            if (input && !isNaN(input) && input >= 3 && input <= 30) {
                maxRounds = parseInt(input);
                roundCountEl.textContent = maxRounds;
                restartGame();
            }
        }

        function pickCard(type) {
            if (!gameData) return;
            lastCard = { type };

            let allCards = [];
            if (activeSettings.easy) allCards = allCards.concat(gameData.easy[type]);
            if (activeSettings.medium) allCards = allCards.concat(gameData.medium[type]);
            if (activeSettings.hard) allCards = allCards.concat(gameData.hard[type]);

            if (allCards.length === 0) { alert('Включите хотя бы один уровень!'); return; }

            const randomCard = allCards[Math.floor(Math.random() * allCards.length)];
            lastCard.text = randomCard;

            resultType.textContent = type === 'truth' ? 'Правда' : 'Действие';
            resultText.textContent = randomCard;
            resultCard.classList.add('show');
            choiceButtons.style.display = 'none';
        }

        function markDone() {
            if (!lastCard) return;
            scores[currentPlayer - 1]++;
            num1El.textContent = scores[0];
            num2El.textContent = scores[1];
            nextTurn();
        }

        function markFail() {
            if (!lastCard) return;
            nextTurn();
        }

        function nextTurn() {
            resultCard.classList.remove('show');
            choiceButtons.style.display = 'flex';

            const totalRounds = scores[0] + scores[1];
            if (totalRounds >= maxRounds) { endGame(); return; }

            currentPlayer = currentPlayer === 1 ? 2 : 1;
            turnLabel.textContent = 'Ходит: ' + playerNames[currentPlayer - 1];
            score1El.classList.toggle('active', currentPlayer === 1);
            score2El.classList.toggle('active', currentPlayer === 2);
        }

        function endGame() {
            choiceButtons.style.display = 'none';
            resultCard.classList.remove('show');
            endScreen.classList.add('show');

            let winnerText;
            if (scores[0] > scores[1]) winnerText = 'Победил(а): ' + playerNames[0] + ' 🏆';
            else if (scores[1] > scores[0]) winnerText = 'Победил(а): ' + playerNames[1] + ' 🏆';
            else winnerText = 'Ничья! 🤝';
            endWinner.textContent = winnerText;
            turnLabel.textContent = 'Игра окончена';
            score1El.classList.remove('active');
            score2El.classList.remove('active');
        }

        function restartGame() {
            currentPlayer = 1;
            scores = [0, 0];
            lastCard = null;
            num1El.textContent = '0'; num2El.textContent = '0';
            turnLabel.textContent = 'Ходит: ' + playerNames[0];
            score1El.classList.add('active'); score2El.classList.remove('active');
            endScreen.classList.remove('show');
            choiceButtons.style.display = 'flex';
            resultCard.classList.remove('show');
        }

        function navigate(page) {
            const pages = {'today':'today.html','questions':'questions.html','games':'games.html','beyond':'beyond.html','moments':'moments.html','we':'we.html'};
            if (pages[page]) window.location.href = pages[page];
        }
    </script>
    <!-- ===== PWA ИНИЦИАЛИЗАЦИЯ ===== -->
    <script src="../js/pwa-init.js"></script>
</body>
</html>
