<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шёпот — Ввод имени</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .name-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 30px;
            z-index: 1;
            animation: fadeIn 0.8s ease;
            width: 100%;
            height: 100%;
        }

        .name-icon {
            font-size: 48px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 15px rgba(201, 169, 110, 0.4));
        }

        .name-title {
            font-family: var(--font-heading);
            font-size: 26px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .name-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .name-input {
            background: var(--bg-input);
            border: 1px solid rgba(201, 169, 110, 0.3);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 16px;
            padding: 14px 20px;
            width: 100%;
            max-width: 260px;
            outline: none;
            text-align: center;
            transition: border 0.3s;
            margin-bottom: 24px;
        }

        .name-input:focus {
            border: 1px solid var(--gold);
        }

        .name-input::placeholder {
            color: var(--text-secondary);
        }

        .gender-section {
            margin-bottom: 24px;
            width: 100%;
            max-width: 260px;
        }

        .gender-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .gender-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .gender-btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(201, 169, 110, 0.2);
            background: rgba(20, 16, 18, 0.4);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-body);
        }

        .gender-btn:hover {
            border-color: rgba(201, 169, 110, 0.5);
            background: rgba(201, 169, 110, 0.1);
        }

        .gender-btn.selected {
            border-color: var(--gold);
            background: rgba(201, 169, 110, 0.2);
            color: var(--gold);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(201, 169, 110, 0.2);
        }

        .name-footer {
            font-size: 11px;
            color: rgba(245, 240, 232, 0.3);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="phone">
        <div class="sparkles">
            <div class="sparkle" style="top: 14%; left: 20%;"></div>
            <div class="sparkle" style="top: 26%; right: 24%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="bottom: 30%; left: 26%; animation-delay: 1s;"></div>
            <div class="sparkle" style="bottom: 22%; right: 22%; animation-delay: 1.5s;"></div>
            <div class="sparkle" style="top: 48%; left: 10%; animation-delay: 0.7s;"></div>
            <div class="sparkle" style="top: 44%; right: 10%; animation-delay: 1.2s;"></div>
        </div>

        <div class="name-screen">
            <div class="name-icon">👤</div>
            <div class="name-title">Как тебя называть?</div>
            <div class="name-subtitle">Партнёр увидит это имя</div>
            <input type="text" class="name-input" id="nameInput" placeholder="Введи имя" maxlength="20" autofocus>
            
            <div class="gender-section">
                <div class="gender-label">Я:</div>
                <div class="gender-buttons">
                    <button class="gender-btn" id="genderMale" onclick="selectGender('male')">👨 Мужчина</button>
                    <button class="gender-btn" id="genderFemale" onclick="selectGender('female')">👩 Женщина</button>
                </div>
            </div>
            
            <button class="btn" id="continueBtn" onclick="saveName()">Продолжить</button>
            <div class="name-footer">Шёпот</div>
        </div>
    </div>

    <script>
        const input = document.getElementById('nameInput');
        const btn = document.getElementById('continueBtn');
        let selectedGender = null;

        btn.style.opacity = '0.5';
        btn.style.pointerEvents = 'none';

        function updateButtonState() {
            if (input.value.trim().length > 0 && selectedGender) {
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            } else {
                btn.style.opacity = '0.5';
                btn.style.pointerEvents = 'none';
            }
        }

        input.addEventListener('input', updateButtonState);

        function selectGender(gender) {
            selectedGender = gender;
            
            document.getElementById('genderMale').classList.toggle('selected', gender === 'male');
            document.getElementById('genderFemale').classList.toggle('selected', gender === 'female');
            
            // Меняем иконку в зависимости от пола
            const icon = document.querySelector('.name-icon');
            icon.textContent = gender === 'male' ? '👨' : '👩';
            
            updateButtonState();
        }

        function saveName() {
            const name = input.value.trim();
            if (name.length > 0 && selectedGender) {
                localStorage.setItem('shepot_my_name', name);
                localStorage.setItem('shepot_my_gender', selectedGender);
                window.location.href = 'step4-qr.html';
            }
        }
    </script>
    <!-- ===== PWA ИНИЦИАЛИЗАЦИЯ ===== -->
    <script src="../js/pwa-init.js"></script>
</body>
</html>
