<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шёпот — Игры</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .page-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: 40px 18px 100px;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            overflow-y: auto;
        }

        .page-title {
            font-family: var(--font-heading);
            font-size: 22px;
            color: var(--text-primary);
            margin-bottom: 2px;
            padding-top: 30px;
        }

        .page-sub {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 14px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 310px;
        }

        .game-card {
            background: rgba(20, 16, 18, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(201, 169, 110, 0.08);
            border-radius: 16px;
            padding: 18px 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .game-card:hover {
            border-color: rgba(201, 169, 110, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .game-icon { font-size: 32px; }

        .game-name {
            font-family: var(--font-heading);
            font-size: 13px;
            color: var(--text-primary);
        }

        .game-desc {
            font-size: 10px;
            color: var(--text-secondary);
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="sparkles">
            <div class="sparkle" style="top: 6%; left: 12%;"></div>
            <div class="sparkle" style="top: 18%; right: 18%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="bottom: 22%; left: 22%; animation-delay: 1s;"></div>
            <div class="sparkle" style="bottom: 14%; right: 16%; animation-delay: 1.5s;"></div>
            <div class="sparkle" style="top: 38%; left: 6%; animation-delay: 0.7s;"></div>
            <div class="sparkle" style="top: 34%; right: 6%; animation-delay: 1.2s;"></div>
        </div>

        <div class="page-screen">
            <div class="page-title">🎲 Игры</div>
            <div class="page-sub">Выбери игру</div>

            <div class="game-grid">
                <div class="game-card" onclick="navigateTo('mission.html')">
                    <span class="game-icon">🎯</span>
                    <div class="game-name">Твоя миссия</div>
                    <div class="game-desc">7 желаний для партнёра</div>
                </div>
                <div class="game-card" onclick="navigateTo('morethanwords.html')">
                    <span class="game-icon">📝</span>
                    <div class="game-name">Больше чем слова</div>
                    <div class="game-desc">30+30+20 заданий</div>
                </div>
                <div class="game-card" onclick="navigateTo('conversation.html')">
                    <span class="game-icon">💬</span>
                    <div class="game-name">Разговор</div>
                    <div class="game-desc">Темы для обсуждения</div>
                </div>
                <div class="game-card" onclick="navigateTo('blinddate.html')">
                    <span class="game-icon">🌹</span>
                    <div class="game-name">Свидание вслепую</div>
                    <div class="game-desc">Идеи для свиданий</div>
                </div>
                <div class="game-card" onclick="navigateTo('wheel.html')" style="grid-column: 1 / -1; max-width: 310px; margin: 0 auto; width: 100%;">
                    <span class="game-icon">🎡</span>
                    <div class="game-name">Колесо фортуны</div>
                    <div class="game-desc">Что делать сегодня?</div>
                </div>
            </div>

            <button class="btn-back" onclick="window.location.href='main.html'">← На главную</button>
        </div>

        <div class="tab-bar">
            <div class="tab" onclick="window.location.href='today.html'"><span class="tab-icon">🏠</span> Сегодня</div>
            <div class="tab" onclick="window.location.href='questions.html'"><span class="tab-icon">💬</span> Вопросы</div>
            <div class="tab active" onclick="window.location.href='games.html'"><span class="tab-icon">🎲</span> Игры</div>
            <div class="tab" onclick="window.location.href='beyond.html'"><span class="tab-icon">🔥</span> За гранью</div>
            <div class="tab" onclick="window.location.href='moments.html'"><span class="tab-icon">📸</span> Моменты</div>
            <div class="tab" onclick="window.location.href='we.html'"><span class="tab-icon">💌</span> Мы</div>
        </div>
    </div>

    <script>
        localStorage.removeItem('shepot_new_wishes');

        function navigateTo(page) {
            window.location.href = page;
        }
    </script>
    <!-- ===== PWA ИНИЦИАЛИЗАЦИЯ ===== -->
    <script src="../js/pwa-init.js"></script>
</body>
</html>
